# Core behavior
set -g default-terminal "screen-256color"
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on

# Prefix and history
unbind C-b
set -g prefix C-s

set -q -g status-utf8 on
setw -q -g utf8 on
set -g history-limit 5000

# Reload this config
bind r source-file /home/record/tmux/tmux.conf \; display-message "/home/record/tmux/tmux.conf sourced"

# Window and status behavior
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g monitor-activity on
set -g visual-activity off
set -g mouse on

# Clear screen and scrollback
bind -n C-l send-keys C-l \; run-shell 'sleep 0.2' \; clear-history

# Session and pane management
bind C-c new-session
bind -n M-v split-window -v
bind -n M-b split-window -h
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number jumps to a window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Move the current pane into window 1-9
bind -n M-! join-pane -t :1
bind -n M-@ join-pane -t :2
bind -n 'M-#' join-pane -t :3
bind -n 'M-$' join-pane -t :4
bind -n M-% join-pane -t :5
bind -n M-^ join-pane -t :6
bind -n M-& join-pane -t :7
bind -n M-* join-pane -t :8
bind -n M-( join-pane -t :9

bind -n M-x kill-pane
bind -n M-f resize-pane -Z
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Window navigation and rename
unbind n
unbind p
bind -n M-o new-window
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-r command-prompt -p "Rename window to:" "rename-window '%%'"

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Copy to the system clipboard when available
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run-shell -b "tmux save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run-shell -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
if -b 'command -v wl-copy > /dev/null 2>&1' 'bind y run-shell -b "tmux save-buffer - | wl-copy"'
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run-shell -b "tmux save-buffer - | pbcopy"'
if -b 'command -v reattach-to-user-namespace > /dev/null 2>&1' 'bind y run-shell -b "tmux save-buffer - | reattach-to-user-namespace pbcopy"'
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run-shell -b "tmux save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run-shell -b "tmux save-buffer - > /dev/clipboard"'

# Buffer list and paste
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer
